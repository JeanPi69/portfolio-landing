name: Deploy to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.61.62.91
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /var/www/landing-portfolio
            git pull origin master
            npm ci
            npm run build
            pm2 restart landing-portfolio --update-env
            pm2 save
