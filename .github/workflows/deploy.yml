name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.61.62.91
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /var/www/landing-portfolio
            git pull origin main
            npm ci --omit=dev
            npm run build
            pm2 restart landing-portfolio || pm2 start npm --name "landing-portfolio" -- start
            pm2 save
